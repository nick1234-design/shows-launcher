name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q ShowsLauncher.zip

      - name: Set addon URL
        run: |
          URL=$(tr -d '[:space:]' < addon_url.txt)
          ESC=$(printf '%s' "$URL" | sed 's/[&|\\]/\\&/g')
          sed -i "s|https://YOUR-ADDON.vercel.app/YOUR_CONFIG|$ESC|" ShowsLauncher/app/src/main/java/com/nick/showslauncher/Config.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        working-directory: ShowsLauncher
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp ShowsLauncher/app/build/outputs/apk/debug/app-debug.apk ShowsLauncher.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ShowsLauncher.apk